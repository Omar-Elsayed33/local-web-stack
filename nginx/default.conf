# Dynamic per-project routing based on the subdomain.
#   demo.test => /var/www/demo/public
#   pos.test  => /var/www/pos/public
server {
    listen 80;

    # Capture the project name from the "<project>.test" host.
    server_name ~^(?<project>.+)\.test$;

    root /var/www/$project/public;
    index index.php index.html;

    charset utf-8;

    # Laravel-style front controller fallback.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        # Resolve the correct script path per project.
        fastcgi_param SCRIPT_FILENAME /var/www/$project/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files (e.g. .env, .git).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
