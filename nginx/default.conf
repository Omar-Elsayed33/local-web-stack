# Dynamic per-project routing based on the subdomain.
#   omar.local => /var/www/omar/public  (if it exists)  else  /var/www/omar
#   demo.local => /var/www/demo/public
#   pos.local  => /var/www/pos/public
#
# Any folder placed in ./www is served automatically — no per-site config.
server {
    listen 80;

    # Capture the project name from the "<project>.local" host.
    server_name ~^(?<project>.+)\.local$;

    # Choose the document root per request:
    #   prefer <project>/public, fall back to <project> when public/ is absent.
    set $docroot /var/www/$project;
    if (-d /var/www/$project/public) {
        set $docroot /var/www/$project/public;
    }
    root $docroot;

    index index.php index.html;
    charset utf-8;

    # Front-controller fallback (works for plain PHP and frameworks).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        # Resolve the correct script path against the chosen document root.
        fastcgi_param SCRIPT_FILENAME $docroot$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files (e.g. .env, .git).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
